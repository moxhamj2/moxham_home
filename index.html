<!DOCTYPE html>
<html>
<head>
    <title>Moxham Home</title>
</head>
<body>

<h1>Moxham Home</h1>

<h2>House Temperature</h2>

<p id="temperature">Loading...</p>

<script>
fetch("temperature.json")
.then(response => response.json())
.then(data => {
    document.getElementById("temperature").innerHTML =
        data.temperature + " °C";
});
</script>

</body>
</html>
